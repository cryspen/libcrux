files:
  # INTRINSICS
  - name: libcrux_intrinsics_avx2
    library: true
    inline_static: true
    api:
      - [libcrux_intrinsics, avx2]
      
  # Constant time ops
  - name: libcrux_ct_ops
    api:
      - [libcrux_ml_kem, constant_time_ops]

  # SHA3 (no mention of libcrux_mldsa in this section, please)

  # Keep the per-target seperation idea: each SHA3 variant in its own file
  - name: libcrux_sha3_avx2
    target: "avx2"
    api:
      - [libcrux_sha3, avx2, "*"]
    private:
      patterns:
        - [libcrux_sha3, avx2, "*"]
        - [libcrux_sha3, simd, avx2, "*"]
        - [libcrux_sha3, generic_keccak, simd256, "*"]
      monomorphizations_exact:
        - [libcrux_sha3, generic_keccak, KeccakState_7d]
        - [Eurydice, arr_50]
        - [Eurydice, arr_c40]
      monomorphizations_of:
        - [libcrux_sha3, avx2, "*"]
        - [libcrux_sha3, simd, avx2, "*"]
        - [libcrux_sha3, generic_keccak, simd256, "*"]
      monomorphizations_using:
        - [libcrux_sha3, avx2, "*"]
        - [libcrux_sha3, simd, avx2, "*"]
        - [libcrux_sha3, generic_keccak, simd256, "*"]

    include_in_h:
      - '"intrinsics/libcrux_intrinsics_avx2.h"'

  # Portable SHA3
  - name: libcrux_sha3_portable
    api:
      patterns:
        - [libcrux_sha3, "*"]
        - [libcrux_sha3, simd, portable, "*"]
        - [libcrux_sha3, generic_keccak, portable, "*"]
        - [libcrux_sha3, portable, "*"]
        - [libcrux_sha3, generic_keccak, "*"]
        - [libcrux_sha3, traits, "*"]
        - [libcrux_sha3, generic_keccak, xof, "*"] # xof is only portable for now
      monomorphizations_of:
        - [libcrux_sha3, simd, portable, "*"]
        - [libcrux_sha3, generic_keccak, portable, "*"]
        - [libcrux_sha3, generic_keccak, "*"]
        - [libcrux_sha3, traits, "*"]
        - [libcrux_sha3, portable, "*"]
        - [libcrux_sha3, generic_keccak, xof, "*"]
      monomorphizations_using:
        - [libcrux_sha3, simd, portable, "*"]
        - [libcrux_sha3, generic_keccak, portable, "*"]
        - [libcrux_sha3, generic_keccak, "*"]
        - [libcrux_sha3, traits, "*"]
        - [libcrux_sha3, portable, "*"]
        - [libcrux_sha3, generic_keccak, xof, "*"]
        
  # Common parts of SHA3 (this catches stuff that hasn't matched above). Must
  # come after the (more precise) patterns above concerning platform-specific hash_functions
  - name: libcrux_sha3_internal
    internal:
      patterns:
        - [libcrux_sha3, "*"]
      monomorphizations_of:
        - [libcrux_sha3, "*"]
      monomorphizations_using:
        - [libcrux_sha3, "*"]

  # MLKEM: MISC NON-ARCHITECTURE SPECIFIC HEADERS
  #
  # inline_static: the libcrux_secrets classify/declassify/cast-op functions
  # claimed here via the `patterns: [libcrux_secrets, "*"]` entry below (the
  # CastOps as_*/I16 helpers -- non-generic, so bundle `patterns` matching
  # claims them directly) must be force-inlined to be free at runtime (see
  # libcrux-secrets: these are all #[inline(always)] no-ops in the default,
  # non-check-secret-independence build). Without inline_static, Karamel only
  # keeps the C `inline` keyword for calls within the same bundle/.c file --
  # any call crossing a bundle boundary (there are many, e.g. from
  # libcrux_mlkem_portable) becomes a real, non-inlinable-without-LTO extern
  # call regardless of the Rust attribute. inline_static emits these as
  # `static inline` directly in this bundle's header instead, so every
  # including .c file gets its own inlinable copy.
  - name: libcrux_mlkem_core
    inline_static: true
    api:
      - [libcrux_ml_kem, constants ]
      - [libcrux_sha3, generic_keccak, constants ]
      # FIXME: removing this trips an internal invariant
    private:
      monomorphizations_of:
        # - [core, "*"]
        # - [libcrux_secrets, "*"]
        - [libcrux_ml_kem, types, "*"]
        - [libcrux_ml_kem, constant_time_ops, "*"]
        - [libcrux_ml_kem, utils, "*" ]
      monomorphizations_using:
        - [libcrux_ml_kem, types, "*"]
      patterns:
        # - [core, "*"]
        - [libcrux_secrets, "*"]
        - [libcrux_ml_kem, types, "*" ]
        - [libcrux_ml_kem, constant_time_ops, "*"]
        - [libcrux_ml_kem, utils, "*" ]
        - [libcrux_ml_kem, variant, "*"]
      monomorphizations_exact:
        - [libcrux_sha3, Sha3_512Digest]
        - [ Eurydice_dst_ref_shared uint8_t size_t_x4]
        - [ Eurydice_dst_ref_shared uint8_t size_t_x2]
        - [ Eurydice_dst_ref uint8_t size_t_x4]
        - [ Eurydice_dst_ref uint8_t size_t_x2]
        - [ "Eurydice_slice uint8_t_x4" ]
        - [ "Eurydice_slice uint8_t_x2" ]
        - [Eurydice_borrow_slice_u8_x4]
        - [Eurydice_borrow_slice_u8_x2]


  # Shared AVX2 infrastructure for ML-KEM (mirrors eurydice/test/libcrux-ml-kem/c.yaml)
  - name: libcrux_mlkem_avx2
    target: "avx2"
    include_in_h:
      - '"intrinsics/libcrux_intrinsics_avx2.h"'
    api:
      - [libcrux_ml_kem, vector, avx2, "*"]
      - [libcrux_ml_kem, hash_functions, avx2, "*"]
    private:
      monomorphizations_using:
        - [libcrux_ml_kem, vector, avx2, "*"]
        - [libcrux_ml_kem, hash_functions, avx2, "*"]
      monomorphizations_of:
        - [libcrux_ml_kem, vector, avx2, "*"]
        - [libcrux_ml_kem, hash_functions, avx2, "*"]
        # Concrete K=2/3/4 instances of avx2 instantiation wrappers. In per-variant
        # extraction Karamel inlines these away; in the combined extraction they
        # survive as named symbols, so claim them explicitly here to keep avx2
        # code out of common.h.
        - [libcrux_ml_kem, ind_cca, instantiations, avx2, "*"]
        - [libcrux_ml_kem, ind_cpa, instantiations, avx2, "*"]
      monomorphizations_exact:
        - [core_core_arch_x86___m128i_x2]
      patterns:
        - [libcrux_ml_kem, ind_cca, instantiations, avx2, "*"]
        - [libcrux_ml_kem, ind_cpa, instantiations, avx2, "*"]

  # Shared portable infrastructure (covers slightly more than just "portable",
  # but greatly simplifies things — mirrors c.yaml's libcrux_mlkem_portable)
  - name: libcrux_mlkem_portable
    api:
      - [libcrux_ml_kem, vector, "*"]
      - [libcrux_ml_kem, hash_functions, portable, "*"]
    private:
      patterns:
        - [libcrux_ml_kem, polynomial, "*"]
      monomorphizations_using:
        - [libcrux_ml_kem, polynomial, "*"]
        - [libcrux_ml_kem, vector, "*"]
        - [libcrux_ml_kem, hash_functions, portable, "*"]
      monomorphizations_of:
        - [libcrux_ml_kem, polynomial, "*"]
        - [libcrux_ml_kem, vector, "*"]
        - [libcrux_ml_kem, hash_functions, portable, "*"]

  # MLKEM-512
  - name: libcrux_mlkem512_avx2
    target: "avx2"
    include_in_h:
      - '"libcrux_mlkem_avx2.h"'
    api:
      - [libcrux_ml_kem, mlkem512, avx2]
      - [libcrux_ml_kem, mlkem512, avx2, unpacked]

  - name: libcrux_mlkem512_portable
    api:
      - [libcrux_ml_kem, mlkem512, portable]
      - [libcrux_ml_kem, mlkem512, portable, unpacked]

  - name: libcrux_mlkem512
    api:
      - [libcrux_ml_kem, mlkem512]

  # MLKEM-768
  - name: libcrux_mlkem768_avx2
    target: "avx2"
    include_in_h:
      - '"libcrux_mlkem_avx2.h"'
    api:
      - [libcrux_ml_kem, mlkem768, avx2]
      - [libcrux_ml_kem, mlkem768, avx2, unpacked]

  - name: libcrux_mlkem768_portable
    api:
      - [libcrux_ml_kem, mlkem768, portable]
      - [libcrux_ml_kem, mlkem768, portable, unpacked]

  - name: libcrux_mlkem768
    api:
      - [libcrux_ml_kem, mlkem768]

  # MLKEM-1024
  - name: libcrux_mlkem1024_avx2
    target: "avx2"
    include_in_h:
      - '"libcrux_mlkem_avx2.h"'
    api:
      - [libcrux_ml_kem, mlkem1024, avx2]
      - [libcrux_ml_kem, mlkem1024, avx2, unpacked]

  - name: libcrux_mlkem1024_portable
    api:
      - [libcrux_ml_kem, mlkem1024, portable]
      - [libcrux_ml_kem, mlkem1024, portable, unpacked]

  - name: libcrux_mlkem1024
    api:
      - [libcrux_ml_kem, mlkem1024]

  # Catch-all for remaining ML-KEM helpers.
  # Needs explicit monomorphizations_of/using because the compact "- [libcrux_ml_kem, "*"]"
  # form only does one-level pattern matching, missing deeply-nested monomorphizations
  # like [libcrux_ml_kem, ind_cca, instantiations, avx2, ...] which would otherwise
  # fall to combined_core and create cycles.
  - name: libcrux_mlkem_common
    private:
      patterns:
        - [libcrux_ml_kem, "*"]
      monomorphizations_of:
        - [libcrux_ml_kem, "*"]
      monomorphizations_using:
        - [libcrux_ml_kem, "*"]
    inline_static: true

  # Here, we apply the same strategy that works for bundling:
  # - start with the most specific stuff: MLDSA-XX-AVX2
  # - move on to less specific stuff: MLDSA-AVX2 (the "leftovers", or common
  #   parts for AVX2) -- it's easy to debug from there because if something ends
  #   up in MLDSA-AVX2 then it can be identified and moved to one of the
  #   individual variants
  # - then on to portable, same deal
  # - finish with a catch-all where everything is marked as private

  # MLDSA-44
  - name: libcrux_mldsa44_avx2
    target: "avx2"
    include_in_h:
      - '"intrinsics/libcrux_intrinsics_avx2.h"'
    api:
      patterns:
        - [libcrux_ml_dsa, ml_dsa_44, avx2, "*"]
      monomorphizations_of:
        - [libcrux_ml_dsa, ml_dsa_44, avx2]

  # MLDSA-65
  - name: libcrux_mldsa65_avx2
    target: "avx2"
    include_in_h:
      - '"intrinsics/libcrux_intrinsics_avx2.h"'
    api:
      patterns:
        - [libcrux_ml_dsa, ml_dsa_65, avx2, "*"]
      monomorphizations_of:
        - [libcrux_ml_dsa, ml_dsa_65, avx2]

  # MLDSA-87
  - name: libcrux_mldsa87_avx2
    target: "avx2"
    include_in_h:
      - '"intrinsics/libcrux_intrinsics_avx2.h"'
    api:
      patterns:
        - [libcrux_ml_dsa, ml_dsa_87, avx2, "*"]
      monomorphizations_of:
        - [libcrux_ml_dsa, ml_dsa_87, avx2]

  # MLDSA: AVX2 stuff shared across variants
  - name: libcrux_mldsa_avx2
    target: "avx2"
    include_in_h:
      - '"intrinsics/libcrux_intrinsics_avx2.h"'
    api:
      patterns:
        - [libcrux_ml_dsa, samplex4, avx2, "*"]
        - [libcrux_ml_dsa, simd, avx2, "*"]
        - [libcrux_ml_dsa, hash_functions, simd256, "*"]
        - [libcrux_ml_dsa, ml_dsa_generic, instantiations, avx2, "*"]
      monomorphizations_of:
        - [libcrux_ml_dsa, samplex4, avx2, "*"]
        - [libcrux_ml_dsa, simd, avx2, "*"]
        - [libcrux_ml_dsa, hash_functions, simd256, "*"]
        - [libcrux_ml_dsa, ml_dsa_generic, instantiations, avx2, "*"]
      monomorphizations_using:
        - [core, arch, x86, "__m256i"]
        - [libcrux_ml_dsa, samplex4, avx2, "*"]
        - [libcrux_ml_dsa, simd, avx2, "*"]
        - [libcrux_ml_dsa, hash_functions, simd256, "*"]
        - [libcrux_ml_dsa, ml_dsa_generic, instantiations, avx2, "*"]
      monomorphizations_exact:
        - [core_core_arch_x86___m256i_x2]
        - [libcrux_secrets, mem_requests, ct_declassify_17]

  - name: libcrux_mldsa44_portable
    api:
      patterns:
        - [libcrux_ml_dsa, ml_dsa_44, portable, "*"]
      monomorphizations_of:
        - [libcrux_ml_dsa, ml_dsa_44, portable]

  - name: libcrux_mldsa65_portable
    api:
      patterns:
        - [libcrux_ml_dsa, ml_dsa_65, portable, "*"]
      monomorphizations_of:
        - [libcrux_ml_dsa, ml_dsa_65, portable]

  - name: libcrux_mldsa87_portable
    api:
      patterns:
        - [libcrux_ml_dsa, ml_dsa_87, portable, "*"]
      monomorphizations_of:
        - [libcrux_ml_dsa, ml_dsa_87, portable]

  - name: libcrux_mldsa_portable
    api:
      patterns:
        - [libcrux_ml_dsa, samplex4, portable, "*"]
        - [libcrux_ml_dsa, hash_functions, portable, "*"]
        - [libcrux_ml_dsa, ml_dsa_generic, instantiations, portable, "*"]
      monomorphizations_of:
        - [libcrux_ml_dsa, samplex4, portable, "*"]
        - [libcrux_ml_dsa, hash_functions, portable, "*"]
        - [libcrux_ml_dsa, ml_dsa_generic, instantiations, portable, "*"]
      monomorphizations_using:
        - [libcrux_ml_dsa, samplex4, portable, "*"]
        - [libcrux_ml_dsa, hash_functions, portable, "*"]
        - [libcrux_ml_dsa, ml_dsa_generic, instantiations, portable, "*"]

  - name: libcrux_mldsa_core
    api:
      patterns:
        - [libcrux_ml_dsa, "*"]
      monomorphizations_of:
        - [libcrux_ml_dsa, "*"]
      monomorphizations_using:
        - [libcrux_ml_dsa, "*"]

  # libcrux_secrets: catch-all for the generic classify/declassify/secret
  # monomorphizations (Classify/Declassify/*Ref/*RefMut impls, secret()) not
  # already claimed by libcrux_mlkem_core above or by the exact carve-out in
  # libcrux_mldsa_avx2 (ct_declassify_17). Unlike the CastOps helpers, these
  # come from generic impls (`impl<T: Scalar> Classify for T`), so they need
  # monomorphizations_of/using, not just `patterns`, to be claimed here
  # instead of falling through to the combined_core catch-all below -- which
  # is what happened before this bundle existed, defeating the
  # #[inline(always)] on these functions the same way described above for
  # libcrux_mlkem_core. Placed last (before combined_core) so it only picks
  # up what nothing more specific already claimed.
  - name: libcrux_secrets
    inline_static: true
    private:
      patterns:
        - [libcrux_secrets, "*"]
      monomorphizations_of:
        - [libcrux_secrets, "*"]
      monomorphizations_using:
        - [libcrux_secrets, "*"]

  # MLDSA: catch-all for things that have not matched earlier
  - name: combined_core
    private:
      monomorphizations_of:
        - [ "*" ]
      patterns:
        - [ "*" ]

naming:
  skip_prefix:
    - [ core, core_arch, x86 ]
    - [libcrux_intrinsics, arm64]
