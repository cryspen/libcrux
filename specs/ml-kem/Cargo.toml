[package]
name = "hacspec_ml_kem"
version = "0.1.0"
edition = "2021"

[dependencies]
hacspec_sha3 = { path = "../sha3" }
hax-lib = { git = "https://github.com/cryspen/hax", rev = "2fedcb2b196f5adea55975d0a023596ec6383ff2" }

[dev-dependencies]
hacspec_sha3 = { path = "../sha3" }
hex = { version = "0.4.3", features = ["serde"] }
proptest = "1.2.0"
rand = "0.9"
serde = { version = "1.0.171", features = ["derive"] }
serde_json = "1.0.102"
