# hax configuration for `hacspec_ml_kem`. Replaces the former `hax_aeneas.py` driver:
# extract with `cargo hax extract` (runs the scenario below). The scenario is
# named after the cargo package so hax derives the existing Lean package name,
# and writes into the existing `proofs/lean/` layout (hax warns this is the
# scenario-less layout; that is intentional). Tool versions are pinned
# workspace-wide in `../hax.toml`. The whole crate is in scope.
#
# hax v0.4.0 sets the `hax_backend_lean` cfg itself (the driver used to pass it
# through RUSTFLAGS), so the `#[cfg(not(hax_backend_lean))]`-gated
# `loop_invariant!` calls are dropped from the Lean extraction (they stay for the
# F* one) and no undeclared marker is emitted.
[scenario.hacspec-ml-kem]
backend = "lean"
output-dir = "proofs/lean"
