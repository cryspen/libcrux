name = "HacspecMlDsa"
version = "0.1.0"
defaultTargets = ["HacspecMlDsa"]

[[lean_lib]]
name = "HacspecMlDsa"

[[require]]
name = "Hax"
git = "https://github.com/cryspen/hax-lean"
rev = "v0.2.0"

# HacspecMlDsa's spec references `hacspec_sha3.sha3.{shake128,shake256}`, so it
# depends on the HacspecSha3 spec. Local worktree path for now (same as ml-kem);
# TODO: point at a pushed cryspen/libcrux rev once the spec migration lands.
[[require]]
name = "HacspecSha3"
path = "../../../sha3/proofs/lean"
