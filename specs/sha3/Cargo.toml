[package]
name = "hacspec_sha3"
version = "0.1.0"
edition = "2021"

[dependencies]
# Pinned to the exact hax-lib rev that libcrux-iot uses, NOT the workspace
# branch pin. libcrux-iot's sha3 crate names `hacspec_sha3::sha3_256` in a
# `#[hax_lib::ensures]`, so both crates end up in one hax/charon run. If the
# two hax-libs differ, cargo keeps both, charon disambiguates the second as
# `hax_lib_1`, and the Lean extraction breaks wholesale (CoreModels only
# models `hax_lib`), e.g.
#   Unknown identifier `hax_lib.Usize.Insts.Hax_lib_1IntToInt.to_int`
hax-lib = { git = "https://github.com/cryspen/hax", rev = "4c9e2b7c75ab1e2b645a4a8361ae86c4504f9800" }

[dev-dependencies]
hex = "0.4.3"
proptest = "1.2.0"
libcrux-sha3 = { path = "../../crates/algorithms/sha3" }
libcrux-kats = { path = "../../crates/testing/kats", features = ["sha3"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(hax)',
    'cfg(hax_backend_lean)',
] }
