[package]
name = "libcrux-hacl"
version = "0.0.4"
edition = "2021"
authors = ["Cryspen", "CE Labs"]
license = "Apache-2.0"
homepage = "https://github.com/celabshq/libcrux"
repository = "https://github.com/celabshq/libcrux"
readme = "Readme.md"
description = "hacl sys crate of libcrux."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[build-dependencies]
cc = { version = "1.1", features = ["parallel"] }
libcrux-platform = { version = "=0.0.3", path = "../platform" }
bindgen = { version = "0.72", optional = true }

[features]
bindings = ["bindgen"] # generate fresh bindings
sha3 = []
default = []

[dev-dependencies]
hex = "0.4.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
