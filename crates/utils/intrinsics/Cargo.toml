[package]
name = "libcrux-intrinsics"
version = "0.0.8"
authors.workspace = true
license.workspace = true
homepage.workspace = true
edition.workspace = true
repository.workspace = true
readme.workspace = true
description = "Libcrux intrinsics crate"
exclude = ["/proofs"]

[dependencies]
hax-lib.workspace = true

[target.'cfg(hax)'.dependencies]
libcrux-core-models = { path = "../core-models", version = "0.0.7" }
# Trust markers (#[libcrux_macros::trusted(replace, …)]) on the cfg(hax)-only
# *_extract.rs modules; extraction-neutral (expands to the item verbatim).
libcrux-macros.workspace = true

[features]
simd128 = []
simd256 = []

[dev-dependencies]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(hax)',
    'cfg(pre_core_models)',
    'cfg(eurydice)',
] }
