[package]
name = "libcrux-drbg-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rand = { version = "0.10", default-features = false, features = ["std_rng"]}

[dependencies.libcrux-hmac-drbg]
path = ".."
features = ["_testing-apis", "rand"]

[[bin]]
name = "new"
path = "fuzz_targets/new.rs"
test = false
doc = false
bench = false
harness = false

[[bin]]
name = "generate"
path = "fuzz_targets/generate.rs"
test = false
doc = false
bench = false
harness = false

[[bin]]
name = "lifecycle"
path = "fuzz_targets/lifecycle.rs"
test = false
doc = false
bench = false
harness = false

[[bin]]
name = "reseeding"
path = "fuzz_targets/reseeding.rs"
test = false
doc = false
bench = false
harness = false
