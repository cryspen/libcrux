name: Build AES-AEADs (RISC-V & ARM targets)

on:
  merge_group:
  pull_request:
    branches: ["main", "dev", "*"]
    paths:
      - "crates/algorithms/aes/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-nostd:
    runs-on: ubuntu-latest
    strategy:
        matrix:
            target: [thumbv7em-none-eabihf, thumbv7em-none-eabi, thumbv8m.main-none-eabihf, riscv64gc-unknown-none-elf]
    defaults:
      run:
        shell: bash
        working-directory: crates/algorithms/aes

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Update dependencies
        run: cargo update

      # Install rust toolchain
      - uses: dtolnay/rust-toolchain@stable
        with:
            targets: ${{ matrix.target }}
        name: Install target Rust toolchain

      # Build
      - name: Build
        run: |
          cargo build --target ${{ matrix.target }}

      - name: Build Release
        run: |
          cargo build --release --target ${{ matrix.target }}

  test:
    runs-on: ubuntu-latest
    strategy:
        fail-fast: false
        matrix:
            target: [riscv64gc-unknown-linux-gnu, armv7-unknown-linux-gnueabihf]
    defaults:
      run:
        shell: bash
        working-directory: crates/algorithms/aes

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install target Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
            toolchain: stable
            targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2 
        with:
          tool: cross@0.2.5

      - name: Test
        run: |
          cross test --verbose --target ${{ matrix.target }}

      - name: Test Release
        run: |
          cross test --verbose --target ${{ matrix.target }} --release
