name: Workspace - Build & Test

on:
  merge_group:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test: 
    if: ${{ github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # 2.83.2
        with:
          tool: nextest
          
      # This does not include doctest, because nextest doesn't support doctests.
      # (The `_mm256_bsrli_epi128` core-models test that used to be skipped here
      # is fixed: the model now follows the Intel spec — byte-shift > 15 zeroes
      # the lane, `rem_euclid` on IMM8 — see core-models x86 interpretations.)
      - name: Run workspace tests
        run: cargo nextest run --workspace --no-fail-fast
        
      - name: Run workspace doctests
        run: cargo test --doc --workspace --no-fail-fast
        
  workspace-test-status:
    if: ${{ always() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Successful
        if: ${{ !(contains(needs.*.result, 'failure')) }} 
        run: exit 0 
      - name: Failing
        if: ${{ (contains(needs.*.result, 'failure')) }} 
        run: exit 1 

